<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lite Music - Fresh Hits & Audio</title>
    <style>
        :root {
            --primary-color: #ff3366;
            --bg-color: #f4f4f4;
            --card-bg: #ffffff;
            --text-color: #121212;
            --text-muted: #666666;
            --header-bg: #ffffff;
            --border-color: #dddddd;
            --search-bg: #e1e1e1;
            --search-text: #121212;
        }

        .dark-mode {
            --primary-color: #ff3366;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
            --header-bg: #000;
            --border-color: #282828;
            --search-bg: #282828;
            --search-text: #fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 30px;
        }

        /* Header */
        header {
            background-color: var(--header-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        /* Boomplay-inspired compact search engine bar */
        .search-bar input {
            padding: 0.3rem 0.7rem;
            border-radius: 12px;
            border: none;
            outline: none;
            width: 140px;
            background-color: var(--search-bg);
            color: var(--search-text);
            font-size: 0.8rem;
        }

        .theme-btn {
            background: var(--search-bg);
            color: var(--text-color);
            border: none;
            padding: 0.3rem 0.6rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .theme-btn:hover {
            opacity: 0.8;
        }

        /* Main Container */
        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        h2 {
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
        }

        /* Music Grid - 3x3 layout */
        .music-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .music-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        /* Small circular profile style photo resembling Boomplay artist/track grid */
        .card-img-container {
            position: relative;
            width: 75px;
            height: 75px;
            margin-bottom: 0.6rem;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 0.2rem;
        }

        .song-title {
            font-size: 0.9rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist-name {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        .download-btn {
            background-color: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 0.25rem;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 600;
            transition: background-color 0.2s, color 0.2s;
        }

        .download-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        /* Responsive */
        @media(max-width: 768px) {
            .music-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 480px) {
            .music-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <a href="#" class="logo">Lite Music</a>
        <div class="header-controls">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search song..." onkeyup="filterMusic()">
            </div>
            <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()">🌙</button>
        </div>
    </header>

    <!-- Main Section -->
    <div class="container">
        <h2>Trending Tracks</h2>
        <div class="music-grid" id="musicGrid">
            <!-- Music cards will be injected dynamically via JavaScript -->
        </div>
    </div>

    <script>
        const musicTracks = [
            {
                id: 1,
                title: "African Sunrise Vibe",
                artist: "DJ Chef Zed",
                cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
            },
            {
                id: 2,
                title: "Lusaka Groove Anthem",
                artist: "Mwizukulu Beats",
                cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
            },
            {
                id: 3,
                title: "Copperbelt bounce",
                artist: "Copper Sound",
                cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
            },
            {
                id: 4,
                title: "Smooth Chillout",
                artist: "Kabwe Nights",
                cover: "https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=300",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
            },
            {
                id: 5,
                title: "Zambezi River Flow",
                artist: "Afro Soul",
                cover: "https://images.unsplash.com/photo-1526478806334-5fd488fcaabc?w=300",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"
            },
            {
                id: 6,
                title: "Sunset Boulevard",
                artist: "Urban Groove",
                cover: "https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=300",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3"
            },
            {
                id: 7,
                title: "Savanna Beats",
                artist: "Rhythm Kings",
                cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3"
            },
            {
                id: 8,
                title: "Midnight Express",
                artist: "Electro Vibe",
                cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"
            },
            {
                id: 9,
                title: "Electronic Horizon",
                artist: "Synth Wave",
                cover: "https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=300",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3"
            }
        ];

        function renderMusic(tracks) {
            const grid = document.getElementById('musicGrid');
            grid.innerHTML = '';
            
            tracks.forEach((track) => {
                grid.innerHTML += `
                    <div class="music-card">
                        <div class="card-img-container">
                            <img src="${track.cover}" alt="${track.title}">
                        </div>
                        <div class="card-content">
                            <div class="song-title" title="${track.title}">${track.title}</div>
                            <div class="artist-name">${track.artist}</div>
                            <a href="${track.audio}" download class="download-btn" target="_blank">Download MP3</a>
                        </div>
                    </div>
                `;
            });
        }

        renderMusic(musicTracks);

        function filterMusic() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = musicTracks.filter(track => 
                track.title.toLowerCase().includes(query) || 
                track.artist.toLowerCase().includes(query)
            );
            renderMusic(filtered);
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const btn = document.getElementById('themeToggleBtn');
            if(document.body.classList.contains('dark-mode')) {
                btn.innerText = "☀️";
            } else {
                btn.innerText = "🌙";
            }
        }
    </script>
</body>
</html>
