<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lite Music - Fresh Hits & Audio</title>
    <style>
        :root {
            --primary-color: #ff3366;
            --bg-color: #fafafa;
            --card-bg: #ffffff;
            --text-color: #121212;
            --text-muted: #666666;
            --header-bg: #ffffff;
            --border-color: #dddddd;
            --search-bg: #e1e1e1;
            --search-text: #121212;
        }

        [data-theme="dark"] {
            --primary-color: #ff3366;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f0f0f0;
            --text-muted: #aaaaaa;
            --header-bg: #181818;
            --border-color: #333333;
            --search-bg: #2d2d2d;
            --search-text: #f0f0f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            background-color: var(--header-bg);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
        }

        /* Reduced size for search engine bar */
        .search-bar input {
            padding: 0.2rem 0.5rem;
            border-radius: 10px;
            border: none;
            outline: none;
            width: 130px;
            background-color: var(--search-bg);
            color: var(--search-text);
            font-size: 0.75rem;
        }

        .header-right {
            display: flex;
            align-items: center;
        }

        /* Float Theme Toggle Button on Center Right */
        .theme-float-btn {
            position: fixed;
            top: 50%;
            right: 15px;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            outline: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
            z-index: 1100;
            font-size: 0.9rem;
            transition: transform 0.2s, background-color 0.2s;
        }

        .theme-float-btn:hover {
            transform: translateY(-50%) scale(1.1);
        }

        /* Main Container */
        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
            width: 100%;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        h2 {
            font-size: 1.8rem;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
        }

        .back-btn {
            background-color: var(--search-bg);
            color: var(--text-color);
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
        }

        .back-btn:hover {
            opacity: 0.8;
        }

        /* Music Grid - 3x3 layout */
        .music-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
        }

        .music-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
            text-align: center;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .music-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        /* Small circular profile style photo matching reference image */
        .card-img-container {
            position: relative;
            width: 85px;
            height: 85px;
            margin-bottom: 0.6rem;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .card-content {
            display: flex;
            flex-direction: column;
            width: 100%;
            gap: 0.2rem;
            align-items: center;
        }

        .song-title {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .artist-name {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        .action-buttons {
            display: flex;
            gap: 0.4rem;
            width: 100%;
            justify-content: center;
            margin-top: 0.3rem;
        }

        .player-btn, .download-btn {
            background-color: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            flex: 1;
        }

        .player-btn:hover, .download-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        /* Footer Animation Styles */
        footer {
            background-color: #1e3a8a;
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 1.5rem;
            font-size: 0.85rem;
            color: white;
            margin-top: 3rem;
            position: relative;
            overflow: hidden;
        }

        .footer-flowers-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .falling-flower {
            position: absolute;
            top: -20px;
            font-size: 16px;
            user-select: none;
            animation: fallAnimation linear infinite;
        }

        @keyframes fallAnimation {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(160px) rotate(360deg);
                opacity: 0.2;
            }
        }

        .footer-content-inner {
            position: relative;
            z-index: 2;
        }

        footer p {
            margin-bottom: 0.5rem;
        }

        /* Responsive */
        @media(max-width: 768px) {
            .music-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 480px) {
            .music-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

    <script>
        const artistsData = [
            {

                    { title: "Drip Season Vibe", artist: "Gunna", cover: "albumcover.png", audio: "1.mp3" }

            {

                cover: "albumcover.png",
                tracks: [
                    { title: "Zambezi River Flow", artist: "Drake", cover: "albumcover.png", audio: "1.mp3" },
                    { title: "Midnight City", artist: "Drake", cover: "albumcover.png", audio: "1.mp3" }
                ]
            },
            {
                name: "Chile One Mr Z...",
                cover: "albumcover.png",
                tracks: [
                    { title: "Sunset Boulevard", artist: "Chile One Mr Z...", cover: "albumcover.png", audio: "1.mp3" },
                    { title: "Fwekeleni", artist: "Chile One Mr Z...", cover: "albumcover.png", audio: "1.mp3" }
                ]
            },
            {
                name: "Driemo Mw",
                cover: "albumcover.png",
                tracks: [
                    { title: "No More", artist: "Driemo Mw", cover: "albumcover.png", audio: "1.mp3" },
                    { title: "Pano", artist: "Driemo Mw", cover: "albumcover.png", audio: "1.mp3" }
                ]
            },
            {
                name: "YoungBoy Nev...",
                cover: "albumcover.png",
                tracks: [
                    { title: "Top Tracks Mix", artist: "YoungBoy Nev...", cover: "albumcover.png", audio: "1.mp3" },
                    { title: "Lonely Child", artist: "YoungBoy Nev...", cover: "albumcover.png", audio: "1.mp3" }
                ]
            },
            {
                name: "Chef 187",
                cover: "albumcover.png",
                tracks: [
                    { title: "Nomine", artist: "Chef 187", cover: "albumcover.png", audio: "1.mp3" },
                    { title: "Coordinate", artist: "Chef 187", cover: "albumcover.png", audio: "1.mp3" }
                ]
            }
        ];

        let currentView = 'artists';
        let currentActiveArtist = null;
        let currentAudio = null;
        let currentPlayingBtn = null;

        function toggleTheme() {
            const html = document.documentElement;
            const themeBtn = document.getElementById('themeToggleBtn');
            if (html.getAttribute('data-theme') === 'dark') {
                html.removeAttribute('data-theme');
                themeBtn.innerText = '🌙';
            } else {
                html.setAttribute('data-theme', 'dark');
                themeBtn.innerText = '☀️';
            }
        }

        function renderArtists(list) {
            const grid = document.getElementById('musicGrid');
            const title = document.getElementById('sectionTitle');
            const backBtn = document.getElementById('backBtn');
            
            title.innerText = "Albums and Tracks";
            backBtn.style.display = 'none';
            grid.innerHTML = '';
            
            if (list.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">No artists found.</p>`;
                return;
            }

            list.forEach((artist) => {
                grid.innerHTML += `
                    <div class="music-card" onclick="openArtistTracks('${artist.name}')">
                        <div class="card-img-container">
                            <img src="${artist.cover}" alt="${artist.name}">
                        </div>
                        <div class="card-content">
                            <div class="song-title" title="${artist.name}">${artist.name}</div>
                            <div class="artist-name">Explore Tracks</div>
                        </div>
                    </div>
                `;
            });
        }

        function openArtistTracks(artistName) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
                currentPlayingBtn = null;
            }

            currentView = 'tracks';
            currentActiveArtist = artistName;
            const artist = artistsData.find(a => a.name === artistName);
            if (!artist) return;

            renderTracks(artist.name, artist.tracks);
        }

        function renderTracks(artistName, tracksList) {
            const grid = document.getElementById('musicGrid');
            const title = document.getElementById('sectionTitle');
            const backBtn = document.getElementById('backBtn');

            title.innerText = `${artistName} - Tracks`;
            backBtn.style.display = 'block';
            grid.innerHTML = '';

            if (tracksList.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">No tracks found.</p>`;
                return;
            }

            tracksList.forEach((track, index) => {
                const audioId = `audio-${artistName}-${index}`.replace(/[^a-zA-Z0-9-_]/g, '');
                grid.innerHTML += `
                    <div class="music-card">
                        <div class="card-img-container">
                            <img src="${track.cover}" alt="${track.title}">
                        </div>
                        <div class="card-content">
                            <div class="song-title" title="${track.title}">${track.title}</div>
                            <div class="artist-name">${track.artist}</div>
                            <audio id="${audioId}" src="${track.audio}"></audio>
                            <div class="action-buttons">
                                <button class="player-btn" id="btn-${audioId}" onclick="togglePlay('${audioId}')">Play ▶</button>
                                <a href="${track.audio}" download class="download-btn" target="_blank">Download</a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function togglePlay(audioId) {
            const audioElem = document.getElementById(audioId);
            const btnElem = document.getElementById(`btn-${audioId}`);

            if (currentAudio && currentAudio !== audioElem) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                if (currentPlayingBtn) {
                    currentPlayingBtn.innerText = "Play ▶";
                }
            }

            if (audioElem.paused) {
                audioElem.play().then(() => {
                    currentAudio = audioElem;
                    currentPlayingBtn = btnElem;
                    btnElem.innerText = "Pause ⏸";
                }).catch(e => {
                    alert("Audio source could not be played.");
                });
            } else {
                audioElem.pause();
                btnElem.innerText = "Play ▶";
                currentAudio = null;
                currentPlayingBtn = null;
            }

            audioElem.onended = function() {
                btnElem.innerText = "Play ▶";
                currentAudio = null;
                currentPlayingBtn = null;
            };
        }

        function resetView() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
                currentPlayingBtn = null;
            }
            currentView = 'artists';
            currentActiveArtist = null;
            document.getElementById('searchInput').value = '';
            renderArtists(artistsData);
        }

        function globalSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const grid = document.getElementById('musicGrid');
            const title = document.getElementById('sectionTitle');
            const backBtn = document.getElementById('backBtn');

            if (query === "") {
                if (currentView === 'artists') {
                    renderArtists(artistsData);
                } else if (currentView === 'tracks' && currentActiveArtist) {
                    const artist = artistsData.find(a => a.name === currentActiveArtist);
                    if (artist) renderTracks(artist.name, artist.tracks);
                }
                return;
            }

            if (currentView === 'tracks' && currentActiveArtist) {
                const artist = artistsData.find(a => a.name === currentActiveArtist);
                if (artist) {
                    const filteredTracks = artist.tracks.filter(track => 
                        track.title.toLowerCase().includes(query) || 
                        track.artist.toLowerCase().includes(query)
                    );
                    renderTracks(artist.name, filteredTracks);
                }
                return;
            }

            currentView = 'global-search';
            title.innerText = `Search Results for "${query}"`;
            backBtn.style.display = 'block';
            grid.innerHTML = '';

            const matchingArtists = artistsData.filter(artist => 
                artist.name.toLowerCase().includes(query)
            );

            let matchingTracks = [];
            artistsData.forEach(artist => {
                artist.tracks.forEach(track => {
                    if (track.title.toLowerCase().includes(query) || track.artist.toLowerCase().includes(query)) {
                        matchingTracks.push(track);
                    }
                });
            });

            if (matchingArtists.length === 0 && matchingTracks.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">No matching artists or tracks found.</p>`;
                return;
            }

            matchingArtists.forEach((artist) => {
                grid.innerHTML += `
                    <div class="music-card" onclick="openArtistTracks('${artist.name}')">
                        <div class="card-img-container">
                            <img src="${artist.cover}" alt="${artist.name}">
                        </div>
                        <div class="card-content">
                            <div class="song-title" title="${artist.name}">${artist.name}</div>
                            <div class="artist-name">Artist / Category</div>
                        </div>
                    </div>
                `;
            });

            matchingTracks.forEach((track, index) => {
                const audioId = `search-audio-${index}`;
                grid.innerHTML += `
                    <div class="music-card">
                        <div class="card-img-container">
                            <img src="${track.cover}" alt="${track.title}">
                        </div>
                        <div class="card-content">
                            <div class="song-title" title="${track.title}">${track.title}</div>
                            <div class="artist-name">${track.artist}</div>
                            <audio id="${audioId}" src="${track.audio}"></audio>
                            <div class="action-buttons">
                                <button class="player-btn" id="btn-${audioId}" onclick="togglePlay('${audioId}')">Play ▶</button>
                                <a href="${track.audio}" download class="download-btn" target="_blank">Download</a>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function initFooterFlowers() {
            const container = document.getElementById('flowerContainer');
            if (!container) return;
            
            const flowerEmojis = ['🌸', '🌼', '🌺', '🌻']; 
            const flowerCount = 12;

            for (let i = 0; i < flowerCount; i++) {
                const span = document.createElement('span');
                span.className = 'falling-flower';
                span.innerText = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
                
                span.style.left = Math.random() * 100 + '%';
                span.style.animationDuration = (3 + Math.random() * 4) + 's';
                span.style.animationDelay = (Math.random() * 5) + 's';
                
                span.style.fontSize = (12 + Math.random() * 10) + 'px';
                
                container.appendChild(span);
            }
        }

        renderArtists(artistsData);
        initFooterFlowers();
    </script>
</body>
</html>
