<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lite Music - Fresh Hits & Audio</title>
    <style>
        :root {
            --primary-color: #ff3366;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
            --header-bg: #000;
            --player-bg: #181818;
            --search-bg: #282828;
            --border-color: #282828;
        }

        .light-mode {
            --primary-color: #e6004c;
            --bg-color: #f4f4f4;
            --card-bg: #ffffff;
            --text-color: #121212;
            --text-muted: #666666;
            --header-bg: #ffffff;
            --player-bg: #eaeaea;
            --search-bg: #e0e0e0;
            --border-color: #dddddd;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 90px;
        }

        /* Header */
        header {
            background-color: var(--header-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .search-bar input {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: none;
            outline: none;
            width: 250px;
            background-color: var(--search-bg);
            color: var(--text-color);
        }

        .theme-toggle-btn {
            background: var(--search-bg);
            border: none;
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        h2 {
            margin-bottom: 1rem;
            font-size: 1.8rem;
            border-left: 4px solid var(--primary-color);
            padding-left: 10px;
        }

        /* Music Grid */
        .music-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
        }

        .music-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.2s, background-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .music-card:hover {
            transform: translateY(-5px);
        }

        /* Resized photo container (Compact square format) */
        .card-img-container {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .music-card:hover .play-overlay {
            opacity: 1;
        }

        .play-btn-sm {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card-content {
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .song-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.2rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .artist-name {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 0.8rem;
        }

        .download-btn {
            background-color: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 0.35rem;
            border-radius: 4px;
            text-align: center;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            transition: background-color 0.2s, color 0.2s;
        }

        .download-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        /* Sticky Audio Player */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--player-bg);
            border-top: 1px solid var(--border-color);
            padding: 0.8rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 2000;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            width: 30%;
        }

        .player-info img {
            width: 45px;
            height: 45px;
            border-radius: 4px;
            object-fit: cover;
        }

        .player-text .p-title {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .player-text .p-artist {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40%;
            gap: 0.4rem;
        }

        .control-btns {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .control-btns button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .control-btns button.main-play {
            font-size: 1.8rem;
            color: var(--primary-color);
        }

        .progress-bar-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .progress-bar {
            flex-grow: 1;
            height: 4px;
            background-color: var(--search-bg);
            border-radius: 2px;
            outline: none;
            accent-color: var(--primary-color);
            cursor: pointer;
        }

        .player-extra {
            width: 30%;
            display: flex;
            justify-content: flex-end;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Responsive */
        @media(max-width: 768px) {
            .player-bar {
                flex-direction: column;
                gap: 0.8rem;
                padding: 0.8rem 1rem;
            }
            .player-info, .player-controls, .player-extra {
                width: 100%;
                justify-content: space-between;
            }
            body {
                padding-bottom: 140px;
            }
            .search-bar input {
                width: 180px;
            }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header>
        <a href="#" class="logo">Lite Music</a>
        <div class="header-actions">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search song or artist..." onkeyup="filterMusic()">
            </div>
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">🌙</button>
        </div>
    </header>

    <!-- Main Section -->
    <div class="container">
        <h2>Trending Tracks</h2>
        <div class="music-grid" id="musicGrid">
            <!-- Music cards injected dynamically -->
        </div>
    </div>

    <!-- Sticky Bottom Player -->
    <div class="player-bar">
        <div class="player-info">
            <img id="currentImage" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150" alt="Cover">
            <div class="player-text">
                <div class="p-title" id="currentTitle">Select a track</div>
                <div class="p-artist" id="currentArtist">Lite Music Artist</div>
            </div>
        </div>

        <div class="player-controls">
            <div class="control-btns">
                <button onclick="prevSong()">⏮</button>
                <button class="main-play" id="playPauseBtn" onclick="togglePlay()">▶</button>
                <button onclick="nextSong()">⏭</button>
            </div>
            <div class="progress-bar-container">
                <span id="currentTime">0:00</span>
                <input type="range" class="progress-bar" id="progressBar" value="0" max="100" oninput="seekAudio()">
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="player-extra">
            <span>⚡ Fast Streaming</span>
        </div>
    </div>

    <!-- Audio element handled by JS -->
    <audio id="audioPlayer" ontimeupdate="updateProgress()" onended="nextSong()"></audio>

    <script>
        const musicTracks = [
            {
                id: 1,
                title: "African Sunrise Vibe",
                artist: "DJ Chef Zed",
                cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=300",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
            },
            {
                id: 2,
                title: "Lusaka Groove Anthem",
                artist: "Mwizukulu Beats",
                cover: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=300",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
            },
            {
                id: 3,
                title: "Copperbelt bounce",
                artist: "Copper Sound",
                cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=300",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
            },
            {
                id: 4,
                title: "Smooth Chillout",
                artist: "Kabwe Nights",
                cover: "https://images.unsplash.com/photo-1501386761578-eac5c94b800a?w=300",
                audio: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
            }
        ];

        let currentTrackIndex = 0;
        const audioPlayer = document.getElementById('audioPlayer');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const currentTitle = document.getElementById('currentTitle');
        const currentArtist = document.getElementById('currentArtist');
        const currentImage = document.getElementById('currentImage');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');
        const themeToggleBtn = document.getElementById('themeToggleBtn');

        // Render Cards
        function renderMusic(tracks) {
            const grid = document.getElementById('musicGrid');
            grid.innerHTML = '';
            
            tracks.forEach((track, index) => {
                grid.innerHTML += `
                    <div class="music-card">
                        <div class="card-img-container">
                            <img src="${track.cover}" alt="${track.title}">
                            <div class="play-overlay">
                                <button class="play-btn-sm" onclick="playTrack(${index})">▶</button>
                            </div>
                        </div>
                        <div class="card-content">
                            <div>
                                <div class="song-title" title="${track.title}">${track.title}</div>
                                <div class="artist-name">${track.artist}</div>
                            </div>
                            <a href="${track.audio}" download class="download-btn" target="_blank">Download MP3</a>
                        </div>
                    </div>
                `;
            });
        }

        renderMusic(musicTracks);

        // Theme toggler logic
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            if (document.body.classList.contains('light-mode')) {
                themeToggleBtn.innerText = "☀️";
            } else {
                themeToggleBtn.innerText = "🌙";
            }
        }

        function playTrack(index) {
            currentTrackIndex = index;
            const track = musicTracks[currentTrackIndex];
            
            audioPlayer.src = track.audio;
            currentTitle.innerText = track.title;
            currentArtist.innerText = track.artist;
            currentImage.src = track.cover;
            
            audioPlayer.play();
            playPauseBtn.innerText = "⏸";
        }

        function togglePlay() {
            if(!audioPlayer.src) {
                playTrack(0);
                return;
            }
            if(audioPlayer.paused) {
                audioPlayer.play();
                playPauseBtn.innerText = "⏸";
            } else {
                audioPlayer.pause();
                playPauseBtn.innerText = "▶";
            }
        }

        function nextSong() {
            currentTrackIndex = (currentTrackIndex + 1) % musicTracks.length;
            playTrack(currentTrackIndex);
        }

        function prevSong() {
            currentTrackIndex = (currentTrackIndex - 1 + musicTracks.length) % musicTracks.length;
            playTrack(currentTrackIndex);
        }

        function updateProgress() {
            if(audioPlayer.duration) {
                const progressPercent = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressBar.value = progressPercent;
                
                currentTimeEl.innerText = formatTime(audioPlayer.currentTime);
                durationEl.innerText = formatTime(audioPlayer.duration);
            }
        }

        function seekAudio() {
            const seekTime = (progressBar.value / 100) * audioPlayer.duration;
            audioPlayer.currentTime = seekTime;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function filterMusic() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = musicTracks.filter(track => 
                track.title.toLowerCase().includes(query) || 
                track.artist.toLowerCase().includes(query)
            );
            renderMusic(filtered);
        }
    </script>
</body>
</html>
